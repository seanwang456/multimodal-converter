[project]
name = "multimodal-converter-api"
version = "0.1.0"
description = "多模态文件转换 Web 应用 — FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 2 真实转换依赖（Phase 1 不强制，避免本地无 libreoffice 时安装失败）
convert = [
    "pillow>=10.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pdfplumber>=0.11",
    "pdf2docx>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# CI 门禁：禁止 Phase 2+ 仍引用临时 handler
[tool.ralph]
no_tmp_handlers = true
